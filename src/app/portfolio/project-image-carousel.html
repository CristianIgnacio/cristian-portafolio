<div
  class="carousel"
  role="region"
  aria-roledescription="carrusel"
  [attr.aria-label]="'Imágenes de ' + projectName()"
>
  <div
    class="viewport"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="cancelGesture()"
    (pointerleave)="cancelGesture()"
  >
    @for (image of images(); track image.src; let index = $index) {
      <div
        class="slide"
        [class.is-active]="currentIndex() === index"
        [attr.aria-hidden]="currentIndex() !== index"
        role="group"
        aria-roledescription="diapositiva"
        [attr.aria-label]="index + 1 + ' de ' + images().length"
      >
        <img
          [ngSrc]="image.src"
          [alt]="image.alt"
          fill
          sizes="(max-width: 700px) 94vw, 43vw"
          draggable="false"
        />
      </div>
    }
  </div>
  @if (hasMultipleImages()) {
    <div class="controls">
      <button
        type="button"
        class="arrow"
        [attr.aria-label]="'Imagen anterior de ' + projectName()"
        (click)="previous()"
      >
        <svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="m14 6-6 6 6 6" />
        </svg>
      </button>
      <div class="dots" role="group" [attr.aria-label]="'Elegir imagen de ' + projectName()">
        @for (image of images(); track image.src; let index = $index) {
          <button
            type="button"
            class="dot-button"
            [attr.aria-label]="
              'Mostrar imagen ' + (index + 1) + ' de ' + images().length + ': ' + image.alt
            "
            [attr.aria-current]="currentIndex() === index ? 'true' : null"
            (click)="goTo(index)"
          >
            <span class="dot" aria-hidden="true"></span>
          </button>
        }
      </div>
      <button
        type="button"
        class="arrow"
        [attr.aria-label]="'Imagen siguiente de ' + projectName()"
        (click)="next()"
      >
        <svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="m10 6 6 6-6 6" />
        </svg>
      </button>
    </div>
  }
  <span class="status" aria-live="polite" aria-atomic="true">
    Imagen {{ currentIndex() + 1 }} de {{ images().length }}: {{ currentImage().alt }}
  </span>
</div>
