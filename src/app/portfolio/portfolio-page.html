<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header" #siteHeader>
  <div class="page-width header-content">
    <a class="brand" href="#inicio" [attr.aria-label]="profile.shortName + ', inicio'"
      >CF<span>.</span></a
    >
    <nav aria-label="Navegación principal">
      <ul>
        @for (section of sections; track section.id) {
          <li>
            <a [href]="'#' + section.id">{{ section.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

<main id="contenido" class="page-width" tabindex="-1">
  <app-home-section [profile]="profile" />
  <app-experience-section [experiences]="experiences" />
  <app-about-section [profile]="profile" />
  <app-technologies-section [groups]="technologyGroups" />
  <app-projects-section [projects]="projects" />
</main>

<footer class="site-footer">
  <div class="page-width footer-content">
    <div>
      <p class="footer-name">{{ profile.shortName }}</p>
      <p class="muted">{{ profile.location }}</p>
    </div>
    <address>
      <a [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    </address>
    <a class="text-link" href="#inicio"
      >Volver al inicio
      <svg
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      >
        <path d="M12 20V4m-6 6 6-6 6 6" />
      </svg>
    </a>
  </div>
</footer>
